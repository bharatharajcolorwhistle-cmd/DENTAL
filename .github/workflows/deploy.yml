name: Deploy Dental PHP Site

on:
  push:
    branches:
      - main

jobs:

  # -----------------------------------
  # CLINIC-STAGING DEPLOY
  # -----------------------------------
  deploy-clinic-staging:
    name: Deploy to clinic-Staging
    runs-on: ubuntu-latest
    environment: clinic-staging

    steps:
      - name: Deploy to clinic-Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/sarvadent-clinic-staging/htdocs/clinic-staging.sarvadent.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "CLINIC-STAGING: before pull"
            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "CLINIC-STAGING: after pull"
            git log -1 --oneline
            
  # -----------------------------------
  # ORTHOKIDS DEPLOY (Runs After Production)
  # -----------------------------------
  deploy-orthokids:
    name: Deploy to orthokids
    needs: deploy-clinic-staging
    runs-on: ubuntu-latest
    environment: orthokids

    steps:
      - name: Deploy to orthokids Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/sarvadent-orthokidssmile/htdocs/orthokidssmile.sarvadent.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "ORTHOKIDS: before pull"
            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "ORTHOKIDS: after pull"
            git log -1 --oneline

  # -----------------------------------
  # OPED DEPLOY (Runs After Production)
  # -----------------------------------
  deploy-oped:
    name: Deploy to oped
    needs: deploy-clinic-staging
    runs-on: ubuntu-latest
    environment: oped

    steps:
      - name: Deploy to oped Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/sarvadent-oped/htdocs/oped.sarvadent.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "OPED: before pull"
            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "OPED: after pull"
            git log -1 --oneline

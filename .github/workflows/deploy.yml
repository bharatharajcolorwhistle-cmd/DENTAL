name: Deploy Dental PHP Site

on:
  push:
    branches:
      - main

jobs:

  # -----------------------------------
  # CLINIC-STAGING DEPLOY
  # -----------------------------------
  deploy-clinic-staging:
    name: Deploy to clinic-Staging
    runs-on: ubuntu-latest
    environment: clinic-staging

    steps:
      - name: Deploy to clinic-Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/sarvadent-clinic-staging/htdocs/clinic-staging.sarvadent.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "======================================"
            echo "CLINIC-STAGING: before pull"
            echo "======================================"

            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "======================================"
            echo "CLINIC-STAGING: after pull"
            echo "======================================"

            git log -1 --oneline


  # -----------------------------------
  # ORTHOKIDSSMILE DEPLOY
  # Runs ONLY after clinic-staging succeeds
  # -----------------------------------
  deploy-orthokidssmile:
    name: Deploy to orthokidssmile
    needs: deploy-clinic-staging
    runs-on: ubuntu-latest
    environment: orthokidssmile

    steps:
      - name: Deploy to Orthokidssmile Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/sarvadent-orthokidssmile/htdocs/orthokidssmile.sarvadent.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "======================================"
            echo "ORTHOKIDSSMILE: before pull"
            echo "======================================"

            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "======================================"
            echo "ORTHOKIDSSMILE: after pull"
            echo "======================================"

            git log -1 --oneline


  # -----------------------------------
  # OPED DEPLOY
  # Runs ONLY after orthokidssmile succeeds
  # -----------------------------------
  deploy-oped:
    name: Deploy to oped
    needs: deploy-orthokidssmile
    runs-on: ubuntu-latest
    environment: oped

    steps:
      - name: Deploy to Oped Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/sarvadent-oped/htdocs/oped.sarvadent.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "======================================"
            echo "OPED: before pull"
            echo "======================================"

            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "======================================"
            echo "OPED: after pull"
            echo "======================================"

            git log -1 --oneline

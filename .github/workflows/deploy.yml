name: Deploy Dental PHP Site

on:
  push:
    branches:
      - main

jobs:

  # -----------------------------------
  # STAGING DEPLOY
  # -----------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/eduwhistle-dental-staging/htdocs/dental-staging.eduwhistle.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "STAGING: before pull"
            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "STAGING: after pull"
            git log -1 --oneline


  # -----------------------------------
  # PRODUCTION DEPLOY (Manual Approval)
  # -----------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production   # Add required reviewers in GitHub

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/eduwhistle-dental-production/htdocs/dental-production.eduwhistle.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "PRODUCTION: before pull"
            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "PRODUCTION: after pull"
            git log -1 --oneline


  # -----------------------------------
  # OPTHALMOLOGY DEPLOY (Runs After Production)
  # -----------------------------------
  deploy-opthalmology:
    name: Deploy to Opthalmology
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: opthalmology

    steps:
      - name: Deploy to Opthalmology Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/eduwhistle-opthalmology/htdocs/opthalmology.eduwhistle.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "OPTHALMOLOGY: before pull"
            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "OPTHALMOLOGY: after pull"
            git log -1 --oneline

  # -----------------------------------
  # Orthokidssmile DEPLOY (Runs After Production)
  # -----------------------------------
  deploy-orthokidssmile:
    name: Deploy to Orthokidssmile
    needs: deploy-opthalmology
    runs-on: ubuntu-latest
    environment: orthokidssmile

    steps:
      - name: Deploy to Orthokidssmile Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/eduwhistle-orthokidssmile/htdocs/orthokidssmile.eduwhistle.com/DENTAL

            git config --global --add safe.directory "$(pwd)"

            echo "ORTHOKIDSSMILE: before pull"
            git log -1 --oneline || true

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "ORTHOKIDSSMILE: after pull"
            git log -1 --oneline
